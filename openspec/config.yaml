schema: research-first

context: |
  Project: A Sparse-Sensing Spatial Digital Twin for Learning Environmental
  Impacts of Non-Networked Appliances in a Single Room.

  Research focus:
  - Sparse IoT sensing and indoor spatial intelligence in one rectangular room.
  - Temperature, humidity, and illuminance field estimation.
  - Environmental-impact learning for non-networked air conditioners, windows,
    lights, and fan-aware boundary conditions.
  - Explainable counterfactual action ranking for decision support.
  - MCP and Web interfaces are secondary service layers, not the headline novelty.
  - The validated temperature operating domain is currently limited to 20-30 C.
  - GRU and LSTM have a completed single-seed SML2010 same-data comparison: neither is lowest-MAE in any of 12 cases, GRU beats vanilla RNN in 2/12, LSTM in 0/12, and H-RNNGATE-01 is not supported; PID remains NOT_EVALUATED.
  - E11A public BMC temporal transfer is evaluated: only 5 of 317 file-device cases were eligible inside 20-30 C, persistence was lowest-MAE in all 5, and the thermal-balance hypothesis was not supported.
  - E11B AAU spatial transfer is evaluated: 42 eligible sensors and 1,641 one-minute snapshots were compared; nearest neighbor achieved MAE 1.175 C and 30/42 per-sensor wins, while 3-D IDW achieved MAE 1.687 C and 6/42 wins, so H-ENC-02 was not supported.
  - E11C independent local-IDW confirmation is evaluated: local IDW reduced macro MAE from 1.301 C to 1.223 C on 1,505 snapshots and had a positive day-block-bootstrap interval, but won only 21/42 sensors rather than the required 26/42, so H-ENC-03 was not supported.

  Current implementation:
  - Python 3.9+ package under digital_twin/.
  - Eight corner sensors are the standard sparse-input topology.
  - Input, validation, target, and pseudo nodes have distinct research roles.
  - Reduced-order physics plus sparse calibration is the primary estimator.
  - A small MLP is an optional additive residual corrector.
  - A standalone pure Elman RNN is a controlled 3-D field comparator, not a production estimator.
  - Evidence includes controlled simulation, real-bedroom target snapshots, and
    task-aligned SML2010/CU-BEMS public benchmarks.
  - Low-cost input nodes and higher-accuracy validation nodes are distinct
    hardware roles; input-grade DHT11 readings are not laboratory references.

  Evidence policy:
  - Synthetic full-field results support only controlled-simulation claims.
  - Real-room measurements support only measured holdout points or zones.
  - Public datasets support task-aligned temporal tasks, not dense 3-D truth.
  - Estimated or pseudo values are never ground truth.
  - Action ranking remains model-based until a real before/after intervention.
  - Method status is explicit: implemented, validated, proposed, or future.

  Governance:
  - Repository-root AGENTS.md is authoritative.
  - Chinese thesis, English IEEE paper, presentations, figures, and generated
    outputs are a coupled deliverable.
  - A claim needs an evidence artifact, reproducible command, and support level.
  - Active research changes remain visibly incomplete until every required
    research-first artifact and synchronized output exists.

rules:
  proposal:
    - State the research gap, current state, proposed state, and claim impact.
    - Distinguish research-method changes from interface-only changes.
    - List every synchronized thesis, IEEE, presentation, figure, and output artifact affected.
    - State whether the change is claim-strengthening, claim-weakening, neutral, or breaking.
  research:
    - Assign stable IDs to research questions, hypotheses, and intended claims.
    - Separate confirmatory hypotheses from exploratory questions.
    - Include claim boundaries, competing explanations, ethics, privacy, and likely threats to validity.
    - Do not convert simulated evidence into real-world causal evidence.
  protocol:
    - Pre-register units of analysis, variables, controls, baselines, exclusions, splits, metrics, and decision criteria.
    - Declare data provenance, licenses, sampling cadence, settling interval, and leakage controls where applicable.
    - Map every experiment to a script and expected machine-readable evidence path.
    - Specify how missing, failed, or contradictory evidence will be reported.
  specs:
    - Use OpenSpec Requirement and Scenario headings with SHALL statements and WHEN/THEN bullets.
    - Give every requirement a stable capability-scoped ID.
    - Keep observable research or system behavior in specs and implementation detail in design.
    - Distinguish input sensors, validation sensors, target points, and model-generated pseudo values.
    - Record evidence and method status without overstating generalization.
  design:
    - Map design decisions to requirement, research-question, hypothesis, and experiment IDs.
    - Preserve the reduced-order physics model as primary and MCP as secondary unless the proposal explicitly changes scope.
    - Prefer shared estimator interfaces and identical data splits for comparisons.
    - Include data flow, leakage prevention, failure modes, compatibility, migration, and artifact synchronization.
  reproducibility:
    - Pin commands, seeds, inputs, outputs, environment assumptions, and expected verification checks.
    - Distinguish committed evidence from ignored raw or normalized public datasets.
    - Include a clean-room rerun order and a provenance record.
  tasks:
    - Use checkboxes and include requirement or experiment IDs on substantive tasks.
    - Separate completed groundwork from remaining work.
    - Include tests, evidence generation, result verification, claim review, synchronized rebuilds, and stale-text searches.
    - Never mark a task complete solely because a document was edited.
  evidence:
    - Record actual run metadata, deviations, machine-readable outputs, metrics, uncertainty, failures, and exclusions.
    - For each hypothesis and claim, conclude supported, partially supported, not supported, or not evaluated.
    - Do not archive a research change while required evidence or synchronized artifacts remain incomplete.

# E11D status (2026-08-23): H-ENC-04 supported as secondary, predictive, non-causal enclosure evidence.

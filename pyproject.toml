[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-single-room-spatial-digital-twin"
version = "0.1.0"
description = "MCP-enabled single-room digital twin prototype for temperature, humidity, and illuminance fields."
requires-python = ">=3.9"

[project.optional-dependencies]
research = [
  "numpy>=1.26,<2",
]
artifacts = [
  "Pillow>=10,<12",
  "python-pptx>=1,<2",
]

[tool.setuptools.packages.find]
include = ["digital_twin*"]
